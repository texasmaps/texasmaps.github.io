let day=DAYS.length-1,sel=null,timer=null;
const num=x=>x==null?"n/a":Math.round(x).toLocaleString();const pct=(x,d=0)=>x==null?"n/a":(100*x).toFixed(d)+"%";
const fmt=m=>m==null?"n/a":(Math.abs(m)<0.05?"Even":(m>0?"Hinojosa +":"Abbott +")+Math.abs(m).toFixed(1));
const DIV=["#c1454b","#d9705f","#f2a98b","#fadccc","#f5f4f1","#d4e5ef","#9ec7df","#5b9bc9","#2f6aa8"];const LAB=["Abbott +30 or more","+15 to 30","+5 to 15","+1 to 5","within 1","+1 to 5","+5 to 15","+15 to 30","Hinojosa +30 or more"];
const mcol=m=>m==null?"#e0e0e0":DIV[m<=-30?0:m<=-15?1:m<=-5?2:m<-1?3:m<=1?4:m<5?5:m<15?6:m<30?7:8];
const left=L.map("left",{zoomControl:false,attributionControl:true,zoomSnap:1});L.control.zoom({position:"topright"}).addTo(left);left.attributionControl.setPrefix("");
const ESRI="https://server.arcgisonline.com/ArcGIS/rest/services/";L.tileLayer(ESRI+"Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}",{maxZoom:16,attribution:"Esri, HERE, Garmin, &copy; OpenStreetMap contributors"}).addTo(left);
left.createPane("labels");left.getPane("labels").style.zIndex=650;left.getPane("labels").style.pointerEvents="none";L.tileLayer(ESRI+"Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}",{maxZoom:16,pane:"labels"}).addTo(left);
const counties=L.geoJSON(G,{style:f=>({color:"#ffffff",weight:0.6,fillOpacity:0.85,fillColor:"#e0e0e0"}),onEachFeature:(f,l)=>{l.on("mouseover",()=>{card(f.properties.k);l.setStyle({weight:1.8,color:"#121212"});l.bringToFront();});l.on("mouseout",()=>{if(sel!==f.properties.k)l.setStyle({weight:0.6,color:"#ffffff"});if(sel)card(sel);});l.on("click",()=>open(f.properties.k,true));}}).addTo(left);
left.fitBounds(counties.getBounds());
function recolor(){counties.eachLayer(l=>{const c=CT[l.feature.properties.k];const v=c&&c.days[day];l.setStyle({fillColor:mcol(v?v.fm:null),color:sel===l.feature.properties.k?"#121212":"#ffffff",weight:sel===l.feature.properties.k?2.2:0.6});});
 let h='<b>Colour key: projected final margin</b><div style="display:flex;width:100%;max-width:420px">';for(let k=0;k<9;k++)h+='<i style="flex:1;height:9px;background:'+DIV[k]+'"></i>';h+='</div><div style="display:flex;justify-content:space-between;width:100%;max-width:420px;margin-top:3px"><span style="width:auto">Abbott +30</span><span style="width:auto">Even</span><span style="width:auto">Hinojosa +30</span></div><div style="flex-basis:100%;color:#666;margin-top:3px">From the Race Tracker model: darker means a bigger projected lead. Steps at 1, 5, 15 and 30 points.</div>';const lg=document.getElementById("legend");lg.style.display="block";lg.innerHTML=h;
 document.getElementById("daylabel").textContent="Day "+(day+1)+" · "+MDs[DAYS[day]];card(sel);}
function card(k){const el=document.getElementById("card");if(!k){const s=ST[day];el.innerHTML="<b>Texas</b> (day "+(day+1)+", "+MDs[DAYS[day]]+")<table><tr><td>Hinojosa wins</td><td><b>"+pct(s.pr)+"</b> of the model's 10,000 runs · "+(s.rating||"")+"</td></tr><tr><td>Expected margin</td><td>"+fmt(s.fm)+" points</td></tr><tr><td>Early voters so far</td><td>"+num(s.ev)+"</td></tr></table>";return;}
 const c=CT[k];const v=c&&c.days[day];if(!v){el.innerHTML="<b>"+(c?c.name:k)+" County</b><br>No tracker data for this day.";return;}
 el.innerHTML="<b>"+c.name+" County</b> (day "+(day+1)+")<table><tr><td>Projected margin</td><td><b>"+fmt(v.fm)+"</b> points · "+(v.rating||"")+"</td></tr><tr><td>Hinojosa wins</td><td>"+pct(v.pr)+" of runs</td></tr><tr><td>Early voters so far</td><td>"+num(v.ev)+" ("+pct(v.turnout,1)+" of "+num(v.reg)+" registered)</td></tr><tr><td>Early vote, Hinojosa share</td><td>"+pct(v.share,1)+" of the two-candidate early vote (estimate)</td></tr><tr><td>Precinct view</td><td>"+(HAS[k]?num(HAS[k].n)+" precincts, click to open":"coming soon")+"</td></tr></table>";}
function open(k,fit){sel=k;document.body.classList.add("split");setTimeout(()=>left.invalidateSize(),50);const c=CT[k];document.getElementById("crumb").innerHTML="Texas › <b>"+(c?c.name:k)+" County</b>";
 const fr=document.getElementById("frame"),soon=document.getElementById("soon");
 if(HAS[k]){soon.style.display="none";fr.style.display="block";const src=HAS[k].file+"#day="+day;if(!fr.dataset.k||fr.dataset.k!==k){fr.src=src;fr.dataset.k=k;}else fr.contentWindow.postMessage({day:day},"*");}
 else{fr.style.display="none";fr.dataset.k="";soon.style.display="block";soon.innerHTML="<b>"+(c?c.name:k)+" County</b>: precinct detail coming soon. The county's model numbers are on the left. Precinct maps are built for the 13 largest counties first and will be added for the rest of Texas.";}
 counties.eachLayer(l=>{if(l.feature.properties.k===k&&fit!==false)left.fitBounds(l.getBounds(),{maxZoom:9,padding:[20,20],animate:false});});recolor();writeHash();}
function close(){sel=null;document.body.classList.remove("split");document.getElementById("crumb").innerHTML="<b>Texas</b>";setTimeout(()=>{left.invalidateSize();left.fitBounds(counties.getBounds());},50);recolor();writeHash();}
function setDay(d){day=d;document.getElementById("day").value=d;recolor();const fr=document.getElementById("frame");if(sel&&HAS[sel]&&fr.contentWindow)fr.contentWindow.postMessage({day:day},"*");writeHash();}
function writeHash(){const h=new URLSearchParams();if(sel)h.set("county",sel);h.set("day",day);history.replaceState(null,"","#"+h.toString());}
document.getElementById("day").oninput=e=>setDay(+e.target.value);document.getElementById("back").onclick=close;
document.getElementById("play").onclick=()=>{const b=document.getElementById("play");if(timer){clearInterval(timer);timer=null;b.textContent="▶ Play";return;}b.textContent="❚❚ Pause";if(day>=DAYS.length-1)setDay(0);timer=setInterval(()=>{if(day>=DAYS.length-1){clearInterval(timer);timer=null;b.textContent="▶ Play";return;}setDay(day+1);},1300);};
window.addEventListener("message",e=>{const m=e.data||{};if(m.type==="precincts-ready"){window.__ready=m;}});
(function(){const h=new URLSearchParams(location.hash.slice(1));const d=+h.get("day");if(h.has("day")&&d>=0&&d<DAYS.length)day=d;document.getElementById("day").value=day;recolor();const k=h.get("county");if(k&&CT[k])open(k,true);})();
