<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Texas County Maps — G4T</title>
<style>
  :root{--bg:#eef1f6;--panel:#fff;--ink:#161b26;--muted:#697084;--line:#e3e7ee;--accent:#0f5fa6;}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg)}
  #shell{display:flex;flex-direction:column;height:100vh}
  header{background:var(--panel);border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(20,27,38,.05);padding:10px 18px}
  .row1{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.01em}
  .sub{font-size:12px;color:var(--muted)}
  nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  nav button{border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 15px;border-radius:999px;font-size:13.5px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:all .12s}
  nav button .dot{width:11px;height:11px;border-radius:3px;flex:none}
  nav button:hover{border-color:#b9c0cf;transform:translateY(-1px)}
  nav button.active{color:#fff;border-color:transparent;font-weight:600;box-shadow:0 2px 7px rgba(20,27,38,.2)}
  .frwrap{flex:1;position:relative;min-height:0;background:var(--bg)}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
  .loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;pointer-events:none;opacity:0;transition:opacity .15s}
  .loading.on{opacity:1}

@media (max-width:760px){
  header.top{padding:8px 12px}
  h1{font-size:15px}
  .sub{display:none}
  nav{flex-wrap:nowrap;overflow-x:auto;margin-top:8px;padding-bottom:3px;-webkit-overflow-scrolling:touch}
  nav button{flex:0 0 auto}
}
/* phone launcher (no iframe — iOS Safari can't scroll/size iframed map pages reliably) */
#launch{display:none;padding:14px;gap:10px;flex-direction:column;overflow-y:auto}
#launch a{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-decoration:none;color:var(--ink);font-size:15px;font-weight:600;box-shadow:0 1px 3px rgba(20,27,38,.06)}
#launch a .dot{width:14px;height:14px;border-radius:4px;flex:none}
#launch a small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:2px}
#launch .note{font-size:12px;color:var(--muted);line-height:1.5;padding:4px 2px}
body.phone .frwrap{display:none}
body.phone nav{display:none}
body.phone #launch{display:flex;flex:1}
</style>
</head>
<body>
<div id="shell">
  <header>
    <div class="row1">
      <h1>🗺 Texas County Maps</h1>
      <span class="sub">Eight interactive maps · one workspace · 254 counties · Central Texas demographics & turnout · districts · data centers</span>
    </div>
    <nav id="tabs"></nav>
  </header>
  <div class="frwrap">
    <iframe id="frame" title="map" src=""></iframe>
    <div class="loading" id="loading">Loading map…</div>
  </div>
  <div id="launch"></div>
</div>
<script>
  const MAPS=[
    {label:'G4T Texas Regional Campaigns', file:'tx_region_builder.html',   color:'#6366f1'},
    {label:'Legislative Districts', file:'tx_districts_map.html',           color:'#6d28d9'},
    {label:'Race & Ethnicity', file:'texas_race_map.html',                 color:'#1f78b4'},
    {label:'Families & Households', file:'texas_families_households_map.html', color:'#2e8b57'},
    {label:'Rural-Urban & SES',file:'texas_rural_ses_map.html',            color:'#d94801'},
    {label:'Elections',        file:'texas_elections_map.html',            color:'#cb181d'},
    {label:'Central Texas Deep Dive', file:'texas_central_deepdive.html',   color:'#0891b2'},
    {label:'Data Center Watch', file:'texas_data_center_map.html',          color:'#4a0404'}
  ];
  const DESC={'tx_region_builder.html':'Regional campaign map · officials & candidates','tx_districts_map.html':'Congress, House, Senate, SBOE · county precincts · cities','texas_race_map.html':'Race & ethnicity by county · largest cities','texas_families_households_map.html':'Families & households','texas_rural_ses_map.html':'Rural–urban & socioeconomic','texas_elections_map.html':'2022 · 2024 · 2026 primary results','texas_central_deepdive.html':'30 Central TX counties · turnout trends · top-3 cities','texas_data_center_map.html':'Data center projects & opposition (large page)'};
  const PHONE=window.matchMedia('(max-width:760px)').matches;
  if(PHONE){
    document.body.classList.add('phone');
    const L=document.getElementById('launch');
    L.innerHTML=MAPS.map(m=>`<a href="${m.file}"><span class="dot" style="background:${m.color}"></span><span>${m.label}<small>${DESC[m.file]||''}</small></span></a>`).join('')+
      '<div class="note">On a phone each map opens as its own page; use the “All maps” button on the map to come back here. Maps load live data and work best over Wi-Fi.</div>';
  }
  const tabs=document.getElementById('tabs');
  const frame=document.getElementById('frame');
  const loading=document.getElementById('loading');
  let current=-1;
  function show(i){
    if(i===current)return;current=i;
    document.querySelectorAll('#tabs button').forEach((b,j)=>{
      const on=j===i;b.classList.toggle('active',on);b.style.background=on?MAPS[j].color:'#fff';
    });
    loading.classList.add('on');
    frame.src=MAPS[i].file;
    // reflect selection in the URL hash so it can be shared/bookmarked
    history.replaceState(null,'','#'+encodeURIComponent(MAPS[i].file.replace('.html','')));
  }
  frame.addEventListener('load',()=>loading.classList.remove('on'));
  MAPS.forEach((m,i)=>{
    const b=document.createElement('button');
    b.innerHTML=`<span class="dot" style="background:${m.color}"></span>${m.label}`;
    b.onclick=()=>show(i);
    tabs.appendChild(b);
  });
  // open the tab named in the URL hash, else the first map
  const want=decodeURIComponent((location.hash||'').replace('#',''));
  const start=Math.max(0,MAPS.findIndex(m=>m.file.replace('.html','')===want));
  if(!PHONE) show(start);
</script>
</body>
</html>
