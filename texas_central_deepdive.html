<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Central Texas — Demographics &amp; Turnout Deep Dive</title>
<style>
  :root{
    --hisp:#1f78b4; --white:#6a3d9a; --black:#e6550d; --asian:#238b45; --other:#7a7a7a;
    --bg:#eef1f6; --panel:#ffffff; --ink:#161b26; --muted:#697084; --line:#e3e7ee; --accent:#0f5fa6;
    --cty:#0f5fa6; --reg:#6a3d9a; --tx:#e6550d; --dem:#2171b5; --rep:#cb181d;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg)}
  #app{display:flex;flex-direction:column;height:100vh}
  header{padding:13px 20px;border-bottom:1px solid var(--line);background:var(--panel);box-shadow:0 1px 3px rgba(20,27,38,.04)}
  .htop{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.01em}
  .sub{font-size:12px;color:var(--muted)}
  .modes{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px;align-items:center}
  .modes .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-right:2px}
  .modes button{border:1px solid var(--line);background:#fff;color:var(--ink);padding:7px 13px;border-radius:999px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:7px;transition:all .12s}
  .modes button .dot{width:11px;height:11px;border-radius:3px}
  .modes select.sel{border:1px solid var(--line);background:#fff;color:var(--ink);padding:6px 10px;border-radius:9px;font-size:13px;cursor:pointer}
  .modes select.sel:disabled{opacity:.45;cursor:default}
  .modes button:hover{border-color:#b9c0cf;transform:translateY(-1px)}
  .modes button.active{color:#fff;border-color:transparent;font-weight:600;box-shadow:0 2px 6px rgba(20,27,38,.18)}
  main{flex:1;display:flex;min-height:0}
  #mapwrap{flex:1;position:relative;min-width:0;background:radial-gradient(circle at 50% 30%,#f4f7fb,#e6eaf2)}
  svg#map{width:100%;height:100%;display:block;cursor:grab}
  svg#map:active{cursor:grabbing}
  .county{stroke:#ffffff;stroke-width:.9px;stroke-linejoin:round;cursor:pointer;transition:stroke-width .12s}
  .county:hover{stroke:#0d1320;stroke-width:1.6px}
  .county.sel{stroke:#0d1320;stroke-width:2.4px}
  .ctyLbl{font-size:10.5px;font-weight:600;fill:#1b2233;paint-order:stroke;stroke:#fff;stroke-width:2.6px;stroke-linejoin:round;pointer-events:none;text-anchor:middle}
  .ctyVal{font-size:9.5px;fill:#3a4257;paint-order:stroke;stroke:#fff;stroke-width:2.4px;pointer-events:none;text-anchor:middle}
  .cityDot{fill:#11151d;stroke:#fff;stroke-width:1.1px;pointer-events:none}
  .cityLbl{font-size:10px;font-weight:600;fill:#11151d;paint-order:stroke;stroke:#fff;stroke-width:2.6px;stroke-linejoin:round;pointer-events:none}
  aside{width:400px;border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:18px}
  .search{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-size:13px;margin-bottom:13px}
  h3{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 9px}
  .legend{margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--line)}
  .lrow{display:flex;align-items:center;gap:9px;font-size:12px;margin:4px 0}
  .lsw{width:28px;height:14px;border-radius:3px;flex:none;border:1px solid rgba(0,0,0,.08)}
  .legdesc{font-size:11.5px;color:var(--muted);line-height:1.5;margin-top:7px}
  .cty{font-size:19px;font-weight:700;margin:2px 0 1px;letter-spacing:-.01em}
  .tot{font-size:12px;color:var(--muted);margin-bottom:10px}
  .tot b{color:var(--ink)}
  .sect{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:16px 0 6px;display:flex;justify-content:space-between;align-items:baseline}
  .sect .note{text-transform:none;letter-spacing:0;font-size:11px}
  .bar{margin:7px 0}
  .bar .top{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px}
  .bar .top .nm{font-weight:600;display:flex;align-items:center;gap:6px}
  .bar .top .nm i{width:11px;height:11px;border-radius:3px;display:inline-block}
  .bar .top .vals{color:var(--muted)}
  .bar .top .vals b{color:var(--ink)}
  .track{height:12px;background:#eef0f4;border-radius:4px;overflow:hidden}
  .fill{height:100%;border-radius:4px}
  .stack{display:flex;height:12px;border-radius:4px;overflow:hidden;gap:2px;background:#eef0f4}
  .stack span{display:block;height:100%}
  .cityrow{padding:8px 8px;border-radius:8px;border:1px solid var(--line);margin:6px 0;background:#fbfcfe}
  .cityrow .ch{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;margin-bottom:5px}
  .cityrow .ch b{font-size:13px}
  .cityrow .ch .cp{color:var(--muted);font-variant-numeric:tabular-nums}
  .cityrow .pcts{display:flex;gap:9px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:5px}
  .cityrow .pcts i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:4px;vertical-align:0}
  .hint{font-size:11.5px;color:var(--muted);line-height:1.55;margin-top:8px}
  .ctyrow{position:relative;display:flex;justify-content:space-between;align-items:center;font-size:12.5px;padding:5px 7px;border-radius:6px;cursor:pointer;overflow:hidden}
  .ctyrow:hover{background:#eef2f7}
  .ctyrow .ci{position:relative;z-index:1;display:flex;align-items:center;gap:6px}
  .ctyrow .cp{position:relative;z-index:1;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;gap:10px}
  .ctyrow .cp b{color:var(--ink)}
  .ctyrow .cbar{position:absolute;left:0;bottom:0;height:3px;opacity:.55;border-radius:2px}
  .chart{width:100%;height:auto;display:block;margin-top:4px}
  .chart .grid{stroke:#e6e9ef;stroke-width:1}
  .chart .ax{font-size:10px;fill:var(--muted)}
  .chart .ln{fill:none;stroke-width:2px;stroke-linejoin:round;stroke-linecap:round}
  .chart .pt{stroke:#fff;stroke-width:2px}
  .chart .dl{font-size:10.5px;font-weight:600;fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-width:3px}
  .chart .dash{stroke-dasharray:3 3}
  .leg{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:4px}
  .leg i{width:14px;height:3px;display:inline-block;border-radius:2px;margin-right:5px;vertical-align:2px}
  .btnrow{display:flex;gap:6px;margin:6px 0 2px}
  .btnrow button{border:1px solid var(--line);background:#fff;padding:4px 10px;border-radius:999px;font-size:11.5px;cursor:pointer;color:var(--ink)}
  .btnrow button.active{background:var(--ink);color:#fff;border-color:transparent}
  table.tt{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:6px;font-variant-numeric:tabular-nums}
  table.tt th{text-align:right;font-weight:600;color:var(--muted);padding:3px 4px;border-bottom:1px solid var(--line)}
  table.tt th:first-child,table.tt td:first-child{text-align:left}
  table.tt td{text-align:right;padding:3px 4px;border-bottom:1px solid #f0f2f6}
  table.big{border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
  table.big th{position:sticky;top:0;background:#fff;text-align:right;font-weight:600;color:var(--muted);padding:6px 7px;border-bottom:2px solid var(--line);cursor:pointer;font-size:11px}
  table.big th:first-child,table.big td:first-child{text-align:left;position:sticky;left:0;background:#fff;font-weight:600}
  table.big th.on{color:var(--ink)}
  table.big td{text-align:right;padding:5px 7px;border-bottom:1px solid #f0f2f6}
  table.big tr.tot td{font-weight:700;border-top:2px solid var(--line);background:#f8fafc}
  table.big tr.crow{cursor:pointer} table.big tr.crow:hover td{background:#eef2f7}
  table.big td.v{color:#111}
  .tblhead{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px}
  .tblhead b{font-size:15px}
  .tblhead .btnrow{margin:0}
  .back{font-size:12px;color:var(--accent);cursor:pointer;margin-bottom:8px;display:inline-block}
  footer{padding:7px 20px;border-top:1px solid var(--line);background:var(--panel);font-size:11px;color:var(--muted);line-height:1.45}
  .tooltip{position:absolute;pointer-events:none;background:#11151d;color:#fff;padding:7px 10px;border-radius:7px;font-size:12px;opacity:0;transition:opacity .1s;white-space:nowrap;z-index:5;box-shadow:0 4px 14px rgba(0,0,0,.25)}
  .tooltip b{font-weight:700}
  .ctl{position:absolute;left:14px;top:14px;display:flex;flex-direction:column;gap:5px}
  .ctl button{width:32px;height:32px;border:1px solid var(--line);background:#fff;border-radius:7px;font-size:17px;cursor:pointer;line-height:1;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .toggles{position:absolute;right:14px;top:14px;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12px;display:flex;gap:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .toggles label{display:flex;align-items:center;gap:5px;cursor:pointer}
  .loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted)}
  .err{padding:24px;color:#b00020;font-size:13px;line-height:1.5}
  @media (max-width:760px){
    #app{height:auto;min-height:100vh} main{flex-direction:column;min-height:0}
    #mapwrap{flex:none;height:60vh;min-height:320px}
    aside{width:100%;border-left:none;border-top:1px solid var(--line);overflow:visible}
    header{padding:10px 12px} h1{font-size:15px;line-height:1.25} .sub{font-size:11px} .modes{margin-top:8px}
  }
</style>
</head>

<div id="app">

    <div class="htop">
      <h1>Central Texas / Austin — Demographics &amp; Turnout</h1>

      <div class="legend" id="legend"></div>

    </aside>
  </main>
  <footer id="foot"></footer>
</div>

<script>
const fmt=n=>n.toLocaleString('en-US');
const pct=(a,b)=>b?100*a/b:0;
const COLORS={h:'#1f78b4',w:'#6a3d9a',b:'#e6550d',a:'#238b45',o:'#7a7a7a'};
const ORDER=[{k:'h',label:'Hispanic / Latino'},{k:'w',label:'White'},{k:'b',label:'Black'},{k:'a',label:'Asian'},{k:'o',label:'Other'}];
const CT=DD.counties, FIPS=Object.keys(CT);
const GEN=[{k:'g06',y:2006},{k:'g08',y:2008},{k:'g10',y:2010},{k:'g12',y:2012},{k:'g14',y:2014},{k:'g16',y:2016},{k:'g18',y:2018},{k:'g20',y:2020},{k:'g22',y:2022},{k:'g24',y:2024}];
const PRI=[{y:2018,d:'p18d',r:'p18r'},{y:2020,d:'p20d',r:'p20r'},{y:2022,d:'p22d',r:'p22r'},{y:2024,d:'p24d',r:'p24r'},{y:2026,d:'p26d',r:'p26r'}];
const tp=(obj,k)=>{const v=obj[k];return v?pct(v[1]??v.to,v[0]??v.vr):null;};
const REG_T=DD.region.to, ST_T=DD.state;
const stateT=k=>{const v=ST_T[k];return pct(v.to,v.vr);};
const regT=k=>{const v=REG_T[k];return pct(v[1],v[0]);};

/* ---------- color helpers ---------- */
function hexToRgb(h){h=h.replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function rgbToHex(a){return '#'+a.map(x=>Math.round(Math.max(0,Math.min(255,x))).toString(16).padStart(2,'0')).join('');}
function mix(c1,c2,t){const a=hexToRgb(c1),b=hexToRgb(c2);return rgbToHex([0,1,2].map(i=>a[i]+(b[i]-a[i])*t));}
function ramp(color,n=7){const light=mix(color,'#ffffff',0.90),dark=mix(color,'#000000',0.10),out=[];for(let i=0;i<n;i++)out.push(mix(light,dark,i/(n-1)));return out;}
function classIndex(breaks,v){for(let i=0;i<breaks.length-1;i++){if(v>=breaks[i]&&v<breaks[i+1])return i;}return v>=breaks[breaks.length-1]?breaks.length-2:0;}

/* ---------- modes ---------- */
const ELECTIONS=[
  {k:'g06',l:'2006 general (midterm)',pri:0,y:2006,est:1},{k:'g08',l:'2008 general (presidential)',pri:0,y:2008,est:1},{k:'g10',l:'2010 general (midterm)',pri:0,y:2010,est:1},
  {k:'g12',l:'2012 general (presidential)',pri:0,y:2012},{k:'g14',l:'2014 general (midterm)',pri:0,y:2014},{k:'g16',l:'2016 general (presidential)',pri:0,y:2016},
  {k:'g18',l:'2018 general (midterm)',pri:0,y:2018},{k:'g20',l:'2020 general (presidential)',pri:0,y:2020},{k:'g22',l:'2022 general (midterm)',pri:0,y:2022},{k:'g24',l:'2024 general (presidential)',pri:0,y:2024},
  {k:'p18d',l:'2018 Dem primary',pri:1},{k:'p18r',l:'2018 GOP primary',pri:1},{k:'p20d',l:'2020 Dem primary',pri:1},{k:'p20r',l:'2020 GOP primary',pri:1},
  {k:'p22d',l:'2022 Dem primary',pri:1},{k:'p22r',l:'2022 GOP primary',pri:1},{k:'p24d',l:'2024 Dem primary',pri:1},{k:'p24r',l:'2024 GOP primary',pri:1},
  {k:'p26d',l:'2026 Dem primary — Governor',pri:1},{k:'p26ds',l:'2026 Dem primary — U.S. Senate',pri:1},{k:'p26r',l:'2026 GOP primary — Governor',pri:1},{k:'p26rs',l:'2026 GOP primary — U.S. Senate',pri:1}
];
const EL={};ELECTIONS.forEach(e=>EL[e.k]=e);
let elA='g24', elB='g18';
const BR_GEN=[30,40,45,50,55,60,65,70,80], BR_PRI=[0,2,4,6,8,11,14,18,25,40];
const MODES={
  turnout:{label:'Turnout',color:'#0f5fa6',kind:'seq',unit:'%',get breaks(){return EL[elA].pri?BR_PRI:BR_GEN;},val:f=>tp(CT[f].to,elA),get title(){return `${EL[elA].l} turnout — ${EL[elA].pri?'party-primary votes':'ballots'} ÷ registered voters`;}},
  chg:{label:'Change between two elections',color:null,kind:'div',unit:' pts',get breaks(){return EL[elA].pri||EL[elB].pri?[-10,-5,-2,-0.5,0.5,2,5,10]:[-10,-6,-3,-1,1,3,6,10];},val:f=>tp(CT[f].to,elA)-tp(CT[f].to,elB),get title(){return `Turnout change: ${EL[elB].l} → ${EL[elA].l} (percentage points)`;}},
  pop:{label:'Population',color:'#2a7f62',kind:'seq',unit:'n',breaks:[0,10000,25000,50000,100000,250000,500000,1000000,2000000],val:f=>CT[f].t,title:'Total population (ACS 2020–2024)'},
  reg:{label:'Registered voters',color:'#2a7f62',kind:'seq',unit:'n',breaks:[0,10000,25000,50000,100000,250000,500000,1000000,2000000],val:f=>CT[f].to[elA][0],get title(){return `Registered voters — ${EL[elA].l}`;}},
  h:{label:'Hispanic / Latino %',color:COLORS.h,kind:'seq',breaks:[0,10,20,30,40,50,70,100],unit:'%',val:f=>pct(CT[f].h,CT[f].t),title:'Hispanic / Latino share of population'},
  w:{label:'White %',color:COLORS.w,kind:'seq',breaks:[0,10,25,40,55,70,85,100],unit:'%',val:f=>pct(CT[f].w,CT[f].t),title:'White (non-Hispanic) share of population'},
  b:{label:'Black %',color:COLORS.b,kind:'seq',breaks:[0,2,5,10,15,20,30,45],unit:'%',val:f=>pct(CT[f].b,CT[f].t),title:'Black share of population'},
  a:{label:'Asian %',color:COLORS.a,kind:'seq',breaks:[0,1,2,4,7,10,15,20],unit:'%',val:f=>pct(CT[f].a,CT[f].t),title:'Asian share of population'},
  dom:{label:'Dominant group',color:'linear-gradient(90deg,#1f78b4,#6a3d9a,#e6550d,#238b45)',kind:'dom',val:f=>dominant(CT[f]),title:'Largest racial / ethnic group in each county'}
};
function dominant(d){let best='h',bv=-1;for(const k of ['h','w','b','a']){if(d[k]>bv){bv=d[k];best=k;}}return best;}
let mode='turnout';
function rampFor(k){const m=MODES[k];return ramp(m.color,m.breaks.length-1);}
const DIV=['#0b3d82','#4a86c8','#a9c6e6','#eef0f4','#f2b28a','#d9662d','#8a2a06'];
function fillFor(f){
  const m=MODES[mode];const v=m.val(f);if(v==null)return '#ddd';
  if(m.kind==='seq')return rampFor(mode)[classIndex(m.breaks,v)];
  if(m.kind==='div')return DIV[classIndex(m.breaks,v)];
  return COLORS[v];
}
const compact=n=>n>=1e6?(n/1e6).toFixed(2).replace(/\.?0+$/,'')+'M':n>=1e3?Math.round(n/1e3)+'k':String(n);
function valText(f){const m=MODES[mode];const v=m.val(f);if(m.kind==='dom')return ORDER.find(o=>o.k===v).label.split(' ')[0];if(m.unit==='n')return compact(v);return (m.kind==='div'&&v>0?'+':'')+v.toFixed(1)+(m.unit==='%'?'%':'');}

const modesEl=document.getElementById('modes');
Object.entries(MODES).forEach(([id,m])=>{const b=document.createElement('button');b.dataset.mode=id;
  const bg=m.kind==='div'?'linear-gradient(90deg,#0b3d82,#eef0f4,#8a2a06)':m.color;
  b.innerHTML=`<span class="dot" style="background:${bg}"></span>${m.label}`;b.onclick=()=>setMode(id);modesEl.appendChild(b);});

  rows.sort((a,b)=>{const va=tblSort==='n'?a.n:a.vals[tblSort],vb=tblSort==='n'?b.n:b.vals[tblSort];const c=typeof va==='string'?va.localeCompare(vb):(va-vb);return tblAsc?c:-c;});

  rows.forEach(r=>{h+=`<tr class="crow" data-f="${r.f}"><td>${r.n}</td>${keys.map(k=>`<td class="v" style="${heat(r.vals[k],k)}">${r.vals[k]==null?'—':r.vals[k].toFixed(1)+'%'}</td>`).join('')}</tr>`;});

function renderLegend(){
  const m=MODES[mode],el=document.getElementById('legend');let rows='';
  if(m.kind==='dom'){rows=ORDER.slice(0,4).map(o=>`<div class="lrow"><span class="lsw" style="background:${COLORS[o.k]}"></span>${o.label} is largest group</div>`).join('');}
  else{const r=m.kind==='seq'?rampFor(mode):DIV;for(let i=0;i<m.breaks.length-1;i++)rows+=m.unit==='n'?`<div class="lrow"><span class="lsw" style="background:${r[i]}"></span>${compact(m.breaks[i])} – ${compact(m.breaks[i+1])}</div>`:`<div class="lrow"><span class="lsw" style="background:${r[i]}"></span>${m.kind==='div'&&m.breaks[i]>0?'+':''}${m.breaks[i]} to ${m.kind==='div'&&m.breaks[i+1]>0?'+':''}${m.breaks[i+1]}${m.unit==='%'?'%':' pts'}</div>`;}
  el.innerHTML=`<h3>${m.title}</h3>${rows}<div class="legdesc">${legendNote()}</div>`;
}
function legendNote(){
  const src='Sources: Texas Legislative Council election data 2018–2024; Texas SoS March 2026 registration &amp; governor-primary votes (2026 proxy).';
  if(mode==='turnout')return `Region: <b>${regT(elA).toFixed(1)}%</b> · Texas: <b>${stateT(elA).toFixed(1)}%</b>. Pick any election above; generals and primaries use different color scales. ${src}`;
  if(mode==='chg'){const r=regT(elA)-regT(elB),t=stateT(elA)-stateT(elB);return `Blue = turnout fell from <b>${EL[elB].l}</b> to <b>${EL[elA].l}</b>; orange = it rose. Region ${r>0?'+':''}${r.toFixed(1)} pts · Texas ${t>0?'+':''}${t.toFixed(1)} pts. Use the two pickers above to compare any pair (e.g. 2018 vs 2022 midterms, or 2024 vs 2026 Dem primaries). ${src}`;}
  if(mode==='pop'){const L=[...FIPS].sort((a,b)=>CT[b].t-CT[a].t);return `Region total <b>${fmt(DD.region.race.t)}</b> people; Travis + Williamson + Bell + McLennan + Hays + Brazos hold ${(100*L.slice(0,6).reduce((a,f)=>a+CT[f].t,0)/DD.region.race.t).toFixed(0)}% of it. Source: U.S. Census ACS 2020–2024 5-year.`;}
  if(mode==='reg')return `Region: <b>${fmt(REG_T[elA][0])}</b> registered voters for ${EL[elA].l} (Texas ${fmt(ST_T[elA].vr)}). Change the election with the picker above. Source: Texas Legislative Council / Texas SoS.`;
  return `Source: U.S. Census ACS 2020–2024 5-year (B03002). Region total ${fmt(DD.region.race.t)} people.`;
}

function zoomTo(f){
  const node=gCounty.selectAll('path.county').filter(d=>d.fips===f).node();if(!node||!zoom)return;

/* ---------- panel: turnout chart (SVG, single axis) ---------- */
function lineChart(series,opts){
  // series: [{name,color,pts:[{x,y}],dash}] ; x = year
  const w=364,h=170,ml=34,mr=48,mt=12,mb=22;const iw=w-ml-mr,ih=h-mt-mb;
  const xs=[...new Set(series.flatMap(s=>s.pts.map(p=>p.x)))].sort();
  const ally=series.flatMap(s=>s.pts.map(p=>p.y)).filter(v=>v!=null);
  let y0=Math.floor(Math.min(...ally)/10)*10,y1=Math.ceil(Math.max(...ally)/10)*10;if(y1-y0<20){y1=y0+20;}
  const X=x=>ml+iw*(xs.indexOf(x))/(xs.length-1),Y=y=>mt+ih*(1-(y-y0)/(y1-y0));
  const ticks=d3.ticks(y0,y1,4);
  let s=`<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${opts.title}">`;
  ticks.forEach(t=>{s+=`<line class="grid" x1="${ml}" x2="${w-mr}" y1="${Y(t)}" y2="${Y(t)}"/><text class="ax" x="${ml-5}" y="${Y(t)+3}" text-anchor="end">${t}%</text>`;});
  xs.forEach((x,i)=>{if(xs.length>6&&i%2===1)return;s+=`<text class="ax" x="${X(x)}" y="${h-6}" text-anchor="middle">${x}</text>`;});
  series.forEach(sr=>{const pts=sr.pts.filter(p=>p.y!=null);
    s+=`<path class="ln${sr.dash?' dash':''}" stroke="${sr.color}" d="${pts.map((p,i)=>(i?'L':'M')+X(p.x).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ')}"/>`;
    pts.forEach(p=>{s+=`<circle class="pt" cx="${X(p.x)}" cy="${Y(p.y)}" r="3.6" fill="${sr.color}"><title>${sr.name} ${p.x}: ${p.y.toFixed(1)}%${p.note?' — '+p.note:''}</title></circle>`;});
    const last=pts[pts.length-1];if(last&&opts.labelEnd)s+=`<text class="dl" x="${X(last.x)+7}" y="${Y(last.y)+3.5}">${last.y.toFixed(1)}%</text>`;
  });
  s+='</svg>';
  s+=`<div class="leg">${series.map(sr=>`<span><i style="background:${sr.color}"></i>${sr.name}</span>`).join('')}</div>`;
  return s;
}
function genSeries(f){ // county (optional), region, texas
  const out=[];
  if(f)out.push({name:CT[f].n.replace(' County',''),color:'var(--cty)',pts:GEN.map(g=>({x:g.y,y:tp(CT[f].to,g.k),note:`${fmt(CT[f].to[g.k][1])} of ${fmt(CT[f].to[g.k][0])} registered`}))});
  out.push({name:'Central TX region',color:'var(--reg)',pts:GEN.map(g=>({x:g.y,y:regT(g.k)}))});
  out.push({name:'Texas',color:'var(--tx)',pts:GEN.map(g=>({x:g.y,y:stateT(g.k)}))});
  return out;
}
function priSeries(f){
  const src=f?(k=>tp(CT[f].to,k)):regT;
  return [
    {name:'Democratic primary (governor race)',color:'var(--dem)',pts:PRI.map(p=>({x:p.y,y:src(p.d),note:p.y===2026?'governor-race votes':''}))},
    {name:'Republican primary (governor race)',color:'var(--rep)',pts:PRI.map(p=>({x:p.y,y:src(p.r),note:p.y===2026?'governor-race votes':''}))},
    {name:'2026 Dem — U.S. Senate race',color:'var(--dem)',dash:1,pts:[{x:2024,y:null},{x:2026,y:src('p26ds'),note:'Talarico vs Crockett'}]},
    {name:'2026 GOP — U.S. Senate race',color:'var(--rep)',dash:1,pts:[{x:2024,y:null},{x:2026,y:src('p26rs'),note:'Cornyn / Paxton / Hunt'}]}

}
function turnoutTable(f){

  const rows=[...GEN.map(g=>({l:`${g.y} general${g.y<=2010?' *':''}`,k:g.k})),...PRI.flatMap(p=>p.y===2026?[{l:'2026 Dem primary — Governor',k:'p26d'},{l:'2026 Dem primary — U.S. Senate',k:'p26ds'},{l:'2026 GOP primary — Governor',k:'p26r'},{l:'2026 GOP primary — U.S. Senate',k:'p26rs'}]:[{l:`${p.y} Dem primary`,k:p.d},{l:`${p.y} GOP primary`,k:p.r}])];
  return `<table class="tt"><tr><th>Election</th><th>Registered</th><th>Ballots</th><th>Turnout</th></tr>${rows.map(r=>{const v=get(r.k);return `<tr><td>${r.l}</td><td>${fmt(v[0])}</td><td>${fmt(v[1])}</td><td><b>${pct(v[1],v[0]).toFixed(1)}%</b></td></tr>`;}).join('')}</table>`;

function primary26Card(f){

      ${['t','t24','chg','d26','n'].map(k=>`<a href="#" data-s="${k}" style="color:${sortKey===k?'var(--ink)':'var(--accent)'};text-decoration:none;font-weight:${sortKey===k?700:400};margin-left:6px">${k==='n'?'A–Z':colLbl[k]}</a>`).join('')}</span></div>
    <div class="ctyrows">${cos.map((c,i)=>`<div class="ctyrow" data-f="${c.f}"><span class="ci"><b>${i+1}.</b> ${c.n.replace(' County','')}<i style="width:9px;height:9px;border-radius:2px;display:inline-block;background:${COLORS[dominant(c)]}" title="largest group"></i></span>
        <span class="cp"><span>${fmt(c.t)}</span><b>${c.t24.toFixed(1)}%</b><span style="color:${c.chg>=0?'#8a2a06':'#0b3d82'}">${c.chg>=0?'+':''}${c.chg.toFixed(1)}</span></span>
        <div class="cbar" style="width:${(100*(sortKey==='n'?c.t:c[sortKey])/cmax).toFixed(1)}%;background:${fillFor(c.f)}"></div></div>`).join('')}</div>
    <div class="hint">Columns: population · turnout in <b>${EL[elA].l}</b> · change from <b>${EL[elB].l}</b> (pts). Change the elections with the pickers at the top. Dot = largest racial/ethnic group. Click a county for its cities and full trend lines.</div>`;
  el.querySelectorAll('.ctyrow').forEach(row=>row.onclick=()=>{select(row.dataset.f);zoomTo(row.dataset.f);});
  el.querySelectorAll('[data-s]').forEach(a=>a.onclick=e=>{e.preventDefault();sortKey=a.dataset.s;renderRegion();});
  wireTable(null);
}

/* ---------- search ---------- */
const dl=document.getElementById('ctylist'),nameToFips={};
FIPS.forEach(f=>{const o=document.createElement('option');o.value=CT[f].n;dl.appendChild(o);nameToFips[CT[f].n.toLowerCase()]=f;
  CT[f].top.forEach(c=>{const o2=document.createElement('option');o2.value=`${c.n} (${CT[f].n.replace(' County','')})`;dl.appendChild(o2);nameToFips[o2.value.toLowerCase()]=f;nameToFips[c.n.toLowerCase()]=nameToFips[c.n.toLowerCase()]||f;});});
document.getElementById('search').addEventListener('change',e=>{const f=nameToFips[e.target.value.trim().toLowerCase()];if(f){select(f);zoomTo(f);}});

/* ---------- geometry ---------- */
function detectGeoid(p,id){
  if(p){for(const k of ['GEOID','geoid','GEO_ID','FIPS','fips','id','COUNTYFP']){if(p[k]!=null){let v=String(p[k]);if(k==='GEO_ID'&&v.includes('US'))v=v.split('US')[1];if(v.length===3&&p.STATE)v=String(p.STATE)+v;if(v.length===5)return v;}}}
  if(id!=null){const v=String(id).padStart(5,'0');if(v.length===5)return v;}return null;
}
async function loadGeometry(){
  const sources=[
    {url:'https://cdn.jsdelivr.net/gh/deldersveld/topojson@master/countries/us-states/TX-48-texas-counties.json',type:'topo'},
    {url:'https://cdn.jsdelivr.net/gh/plotly/datasets@master/geojson-counties-fips.json',type:'geo'}
  ];
  for(const s of sources){
    try{
      const res=await fetch(s.url);if(!res.ok)throw new Error(res.status);const j=await res.json();
      let feats;
      if(s.type==='topo'){const key=Object.keys(j.objects)[0];feats=topojson.feature(j,j.objects[key]).features;}else feats=j.features;
      feats=feats.map(ft=>{const g=detectGeoid(ft.properties,ft.id);ft.geoid=g;ft.fips=g?g.slice(-3):null;return ft;}).filter(ft=>ft.geoid&&ft.geoid.slice(0,2)==='48'&&CT[ft.fips]);
      if(feats.length>=28)return feats;
    }catch(e){}
  }
  throw new Error('No geometry source available');
}
(async function init(){
  try{features=await loadGeometry();}catch(e){document.getElementById('loading').innerHTML='<div class="err">Could not load county boundaries (needs internet access to cdn.jsdelivr.net).</div>';return;}
  const fc={type:'FeatureCollection',features};
  projection=d3.geoConicConformal().parallels([27.41666667,34.91666667]).rotate([100,0]).fitExtent([[30,30],[W-30,H-30]],fc);
  path=d3.geoPath(projection);
  gCounty.selectAll('path.county').data(features).enter().append('path').attr('class','county').attr('d',path)
    .on('mousemove',(ev,d)=>showTip(ev,d.fips)).on('mouseleave',()=>tip.style.opacity=0)
    .on('click',(ev,d)=>{select(d.fips);});
  const lbl=gLbl.selectAll('g.l').data(features).enter().append('g').attr('class','l').attr('transform',d=>{const c=path.centroid(d);return `translate(${c[0]},${c[1]})`;});
  lbl.append('text').attr('class','ctyLbl').attr('y',-2).text(d=>CT[d.fips].n.replace(' County',''));
  lbl.append('text').attr('class','ctyVal').attr('y',10).text(d=>valText(d.fips));
  // top-3 city dots (those with coordinates)
  const cities=FIPS.flatMap(f=>CT[f].top.slice(0,3).filter(c=>c.lat!=null).map((c,i)=>({...c,rank:i,f})));
  const cg=gCity.selectAll('g.city').data(cities).enter().append('g').attr('class','city').attr('transform',d=>{const p=projection([d.lon,d.lat]);return `translate(${p[0]},${p[1]})`;});
  cg.append('circle').attr('class','cityDot').attr('r',d=>d.t>50000?3.2:(d.t>10000?2.4:1.8));
  cg.append('text').attr('class','cityLbl').attr('x',5).attr('y',3.5).attr('display','none').text(d=>d.n);
  zoom=d3.zoom().scaleExtent([1,8]).on('zoom',e=>{
    gMap.attr('transform',e.transform);const k=e.transform.k;
    gCity.selectAll('.cityDot').attr('r',d=>(d.t>50000?3.2:(d.t>10000?2.4:1.8))/k*Math.min(1.6,Math.sqrt(k))).style('stroke-width',(1.1/k)+'px');
    gCity.selectAll('.cityLbl').attr('display',d=>((k>=1.5&&d.t>=50000)||(k>=2.2&&d.t>=10000)||k>=3.5)?null:'none').style('font-size',(10/k)+'px').style('stroke-width',(2.6/k)+'px').attr('x',5/k).attr('y',3.5/k);
    gLbl.selectAll('.ctyLbl').style('font-size',(10.5/k)+'px').style('stroke-width',(2.6/k)+'px').attr('y',-2/k);
    gLbl.selectAll('.ctyVal').style('font-size',(9.5/k)+'px').style('stroke-width',(2.4/k)+'px').attr('y',10/k);
    gCounty.selectAll('.county').style('stroke-width',d=>((d.fips===selFips?2.4:0.9)/k)+'px');
  });
  svg.call(zoom);
  document.getElementById('zin').onclick=()=>svg.transition().call(zoom.scaleBy,1.6);
  document.getElementById('zout').onclick=()=>svg.transition().call(zoom.scaleBy,0.625);
  document.getElementById('zreset').onclick=()=>svg.transition().duration(500).call(zoom.transform,d3.zoomIdentity);
  document.getElementById('tCities').onchange=e=>gCity.attr('display',e.target.checked?null:'none');
  document.getElementById('tVals').onchange=e=>gLbl.selectAll('.ctyVal').attr('display',e.target.checked?null:'none');
  document.getElementById('loading').style.display='none';
  setMode('turnout');
  document.getElementById('foot').innerHTML=`Region (30 counties) general turnout: ${GEN.map(g=>g.y+' '+regT(g.k).toFixed(1)+'%').join(' · ')}. 2026 primaries — Dem ${regT('p26d').toFixed(1)}% (gov) / ${regT('p26ds').toFixed(1)}% (Senate), GOP ${regT('p26r').toFixed(1)}% / ${regT('p26rs').toFixed(1)}%. Sources: Texas Secretary of State canvasses (2006–2010 generals; March 2026 primaries via goelect.txelections.civixapps.com; March 2026 registration); Texas Legislative Council election data (registered voters &amp; ballots cast, 2012–2024); U.S. Census Bureau ACS 2020–2024 5-year (B03002) via Census Reporter.`;
})();
</script>
