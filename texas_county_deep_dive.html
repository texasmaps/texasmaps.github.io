<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Texas County Deep Dive</title>
<meta name="description" content="A county command center for Texas: search a county or city, read what changed in plain English with the numbers underneath, color the map by one measure at a time, compare counties, and prepare a roundtable brief. Overview, Elections, Ballot, Money, Districts, Community, Water, Data Centers.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="tx_county_map.css?v=20260928-15">
<link rel="stylesheet" href="tx_deep_dive.css?v=20260928-15">
<style>.loading{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:var(--ink3);font-size:13px}</style>
</head>
<body class="pro">
<div class="app pro">
<header>
  <div class="rb-top">
    <h1 id="h1">Texas <span>County</span> Deep Dive</h1>
    <div class="tabs" id="tabs"></div>
    <div class="ccsearch"><span class="mag">⌕</span><input id="q" type="search" placeholder="Search a county or city…" autocomplete="off" aria-label="Search a county or city"><div class="sg" id="sg"></div></div>
    <button id="layersbtn" class="phoneonly" type="button" aria-label="Show the map layers">Layers</button>
    <button id="menubtn" type="button" aria-label="Show the county panel">County</button>
    <a class="allmaps" href="index.html">All maps</a>
  </div>
  <div class="rb-body" id="ribbon"></div>
</header>
<div class="contents" id="contents"></div>
<main>
  <svg id="map" xmlns="http://www.w3.org/2000/svg"></svg>
  <div class="ctrl zoom"><button id="zin" title="Zoom in">+</button><button id="zout" title="Zoom out">−</button><button id="zfit" title="Whole state">⌂</button></div>
  <div class="legend" id="legend"></div>
  <div class="tip" id="tip"></div>
  <div class="statusbar" id="statusbar"><span class="sb-cur" id="sb-cur">Move over the map to read a county</span><span class="sb-scale" id="sb-scale"></span><span class="stats" id="stats"></span></div>
  <div class="loading" id="loading">Loading the map…</div>
</main>
<aside>
  <div class="ph"><span id="side-title">County</span><button type="button" class="collapse" data-collapse="side" title="Collapse this pane">»</button></div>
  <div class="tabs" id="tabs2"></div>
  <div class="side" id="side"></div>
</aside>
<div class="tray closed" id="tray"></div>
</div>
