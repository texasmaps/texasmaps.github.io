<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Texas Rainfall & Data Centers</title>
<meta name="description" content="Average annual rainfall across Texas (PRISM 1991–2020 normals) and the last 12 months versus normal, with data center sites from Texas Data Center Watch: which projects sit in the driest parts of the state.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="tx_water_map.css?v=20260925-7">
</head>
<body>
<div class="app">
<header>
  <button id="menubtn" aria-label="Show the list">☰ List</button>
  <h1>Texas <span>Rainfall</span> &amp; Data Centers</h1>
  <a class="allmaps" href="index.html">All maps</a>
  <div class="stats" id="stats"></div>
</header>
<aside>
  <div class="intro">How much rain falls where the data centers are going, and how the past year compares with usual. Orange is drier than usual, blue is wetter. Click a county or a site for its water story.</div>
  <div class="side" id="side"></div>
</aside>
<main>
  <svg id="map" xmlns="http://www.w3.org/2000/svg"></svg>
  <div class="ctrl"><button id="zin" title="Zoom in">+</button><button id="zout" title="Zoom out">−</button><button id="zfit" title="Reset view">⌂</button></div>
  <div class="legend" id="legend"></div>
  <div class="tip" id="tip"></div>
</main>
</div>
<script src="tx_counties.js?v=20260925-7"></script>
<script src="tx_dc_sites.js?v=20260925-7"></script>
<script src="tx_aquifers.js?v=20260925-7"></script>
<script src="tx_water_grid.js?v=20260925-7"></script>
<script src="tx_county_water.js?v=20260925-7"></script>
<script src="tx_surface_water.js?v=20260925-7"></script>
<script src="tx_water_map.js?v=20260925-7"></script>
<script>
const {esc,fmtMW,num,COL,LBL}=WM, $=id=>document.getElementById(id);
const P=WM.projects, side=$('side'), BINS=WM.BINS.precip, LBLS=WM.BINLBL.precip, RC=WM.water&&WM.water.recent;
const sumMW=list=>Math.round(list.reduce((t,s)=>t+(s.mw||0),0));
const zoneOf=s=>WM.binOf(s.rain,BINS);
const zones=LBLS.map((l,i)=>{const on=P.filter(s=>s.rain&&zoneOf(s)===i);return {i,l,on,mw:sumMW(on),hot:on.filter(s=>s.hot).length};});
const rains=P.filter(s=>s.rain).map(s=>s.rain).sort((a,b)=>a-b), median=rains[Math.floor(rains.length/2)];
const dry=P.filter(s=>s.rain&&s.rain<20);
const byCounty={};P.forEach(s=>(byCounty[s.fips]=byCounty[s.fips]||[]).push(s));
const stat=(v,l)=>`<div class="stat"><b>${v}</b><small>${l}</small></div>`;
const dryNow=P.filter(s=>s.recent&&s.recent<70);
$('stats').innerHTML=stat(P.length,'data center projects')+(RC?stat(dryNow.length,'below 70% of usual rain, past 12 months'):'')+stat(dry.length,'in the dry west (under 20 in a year)');
let ctx={mode:'list'};
const zoneRow=z=>`<div class="row" data-zone="${z.i}" tabindex="0"><span class="sw" style="--c:${WM.ramp('precip')[z.i]};opacity:1"></span><div><div class="n">${z.l} in/yr</div><div class="m">${z.on.length} project${z.on.length===1?'':'s'}${z.hot?' · '+z.hot+' contested':''}</div></div><span class="v"><b>${z.mw?fmtMW(z.mw):'—'}</b><br>announced</span></div>`;
const countyRow=f=>{const c=WM.cw.counties[f]||{},n=byCounty[f].length;return `<div class="row" data-county="${f}" tabindex="0"><span class="sw" style="--c:${WM.ramp('precip')[WM.binOf(c.r||0,BINS)]};opacity:1"></span><div><div class="n">${esc(c.n||WM.cname[f])} County</div><div class="m">${n} project${n===1?'':'s'} · ${fmtMW(sumMW(byCounty[f]))}</div></div><span class="v"><b>${c.r?c.r:'—'}</b><br>in/yr avg.</span></div>`;};
function renderList(){
  const driest=P.filter(s=>s.rain).sort((a,b)=>a.rain-b.rain||(b.mw||0)-(a.mw||0)).slice(0,12);
  const dryCounties=Object.keys(byCounty).filter(f=>WM.cw.counties[f]&&WM.cw.counties[f].r).sort((a,b)=>WM.cw.counties[a].r-WM.cw.counties[b].r).slice(0,12);
  const driestNow=P.filter(s=>s.recent).sort((a,b)=>a.recent-b.recent)[0];const hou=WM.waterAt(-95.37,29.76).rain,elp=WM.waterAt(-106.49,31.76).rain;
  const pl=(n,one,many)=>n===1?one:many;const wet=P.filter(s=>s.recent>110).length;
  const facts=[RC?`<b>${dryNow.length} ${pl(dryNow.length,'project is','projects are')}</b> in ${pl(dryNow.length,'a place','places')} that got less than 70% of the usual rain over the past 12 months (${esc(RC.label)}).`:'',
    RC&&driestNow?`The driest spot right now: <b>${esc(driestNow.name)}</b> in ${esc(driestNow.county)} County, at ${driestNow.recent}% of its usual rain.`:'',
    `<b>${dry.length} ${pl(dry.length,'project is','projects are')}</b> in the dry west, where under 20 inches falls in a normal year. A typical project gets ${median} inches a year; Houston gets about ${hou}, El Paso about ${elp}.`,
    RC?`<b>${wet} ${pl(wet,'project is','projects are')}</b> in ${pl(wet,'a place','places')} that ${pl(wet,'was','were')} wetter than usual over the past 12 months.`:''].filter(Boolean);
  side.innerHTML=WM.glance(facts)+WM.siteList()+`${RC?`<div class="blk"><h3>Driest vs. usual <small>last 12 months · ${esc(RC.label)}</small></h3>${P.filter(s=>s.recent).sort((a,b)=>a.recent-b.recent||(b.mw||0)-(a.mw||0)).slice(0,12).map(s=>WM.siteRow(s,`<b>${s.recent}%</b><br>of usual rain`)).join('')}</div>`:''}
    <div class="blk"><h3>Projects by rainfall zone <small>avg. annual, inches</small></h3>${zones.map(zoneRow).join('')}</div>
    <div class="blk"><h3>Driest sites <small>lowest average rainfall first</small></h3>${driest.map(s=>WM.siteRow(s,`<b>${s.rain}</b><br>in/yr`)).join('')}</div>
    <div class="blk"><h3>Driest counties with projects <small>county average</small></h3>${dryCounties.map(countyRow).join('')}</div>
    `+WM.note('Counts leave out small colocation sites and withdrawn projects.');
  WM.renderRows();WM.collapseAfter(2);
}
function setHash(h){try{history.replaceState(null,'',location.pathname+location.search+(h?'#'+h:''));}catch(e){}}
function showZone(i){
  const z=zones[i];if(!z)return;ctx={mode:'zone',i};
  WM.highlightCounty(null);WM.select(null);WM.setFilter(s=>s.rain&&zoneOf(s)===i);WM.fit();
  const st={};z.on.forEach(s=>st[s.status]=(st[s.status]||0)+1);
  const sites=z.on.slice().sort((a,b)=>a.rain-b.rain||(b.mw||0)-(a.mw||0));
  side.innerHTML=`<div class="detail"><button class="back" id="back">← All zones</button><h2>${z.l} inches a year</h2><div class="sub">${z.on.length} project${z.on.length===1?'':'s'}${z.mw?' · '+fmtMW(z.mw)+' announced':''}${z.hot?' · '+z.hot+' contested':''}</div>
    <dl class="kv"><dt>Operating</dt><dd>${st.operating||0}</dd><dt>Under construction</dt><dd>${st.under_construction||0}</dd><dt>Proposed</dt><dd>${st.proposed||0}</dd></dl></div>
    <div class="blk"><h3>Sites in this zone <small>driest first</small></h3>${sites.length?sites.map(s=>WM.siteRow(s,`<b>${s.rain}</b><br>in/yr`)).join(''):'<div class="empty">No data center projects in this zone.</div>'}</div>`;
  $('back').onclick=back;setHash('zone='+i);
}
function showSite(s){
  WM.select(s.id);WM.zoomSite(s);
  side.innerHTML=`<div class="detail" style="padding-bottom:0"><button class="back" id="back">← Back</button></div>`+WM.siteHTML(s);
  $('back').onclick=()=>{WM.select(null);if(ctx.mode==='zone')showZone(ctx.i);else if(ctx.mode==='county')showCounty(ctx.fips);else back();};
  setHash('site='+encodeURIComponent(s.id));
}
function showCounty(f){
  ctx={mode:'county',fips:f};WM.setFilter(null);WM.select(null);WM.highlightCounty(f);WM.zoomCounty(f);
  const c=WM.cw.counties[f]||{};const sites=(byCounty[f]||[]).slice().sort((a,b)=>(b.mw||0)-(a.mw||0));
  const rank=Object.values(WM.cw.counties).filter(x=>x.r).sort((a,b)=>a.r-b.r).findIndex(x=>x.n===c.n)+1;
  side.innerHTML=`<div class="detail"><button class="back" id="back">← Back to list</button><h2>${esc(WM.cname[f])} County</h2><div class="sub">${c.r?c.r+' in/yr average rainfall':'no rainfall value'}${rank?' · '+rank+(rank===1?'st':rank===2?'nd':rank===3?'rd':'th')+' driest of 254 counties':''}</div>
    <dl class="kv">${RC?`<dt>Last 12 months</dt><dd>${c.p?c.p+'% of usual rain':'—'}</dd>`:''}<dt>Projects</dt><dd>${sites.length}${sites.length?' · '+fmtMW(sumMW(sites))+' announced':''}</dd><dt>TWDB wells</dt><dd>${num(c.w)}${c.nw?' · '+num(c.nw)+' drilled since 2020':''}</dd></dl></div>
    <div class="blk"><h3>Sites in ${esc(WM.cname[f])} County</h3>${sites.length?sites.map(s=>WM.siteRow(s,`<b>${s.rain||'—'}</b><br>in/yr`)).join(''):'<div class="empty">No data center projects listed here.</div>'}</div>`;
  $('back').onclick=back;setHash('county='+f);
}
function back(){ctx={mode:'list'};WM.highlightCounty(null);WM.setFilter(null);WM.select(null);WM.fit();renderList();setHash('');}
side.addEventListener('click',e=>{const r=e.target.closest('.row[data-zone],.row[data-site],.row[data-county]');if(!r)return;if(r.dataset.zone)showZone(+r.dataset.zone);else if(r.dataset.county)showCounty(r.dataset.county);else showSite(WM.byId[r.dataset.site]);WM.closeAside();});
side.addEventListener('keydown',e=>{if(e.key==='Enter'){const r=e.target.closest('.row');if(r)r.click();}});
WM.init({major:false,minor:false,base:RC?'recent':'precip',pins:true,colo:false,controls:['pins','colo','aqlines','rivers','basins','base'],
  listMetric:s=>RC?({html:`<b>${s.recent||'—'}%</b><br>of usual rain`,key:s.recent||999}):({html:`<b>${s.rain||'—'}</b><br>in/yr`,key:s.rain||999}),listSortLabel:'driest first',listAsc:true,
  onSite:showSite,onCounty:showCounty,onAquifer:null,onBackground:()=>{if(ctx.mode!=='list')back();},
  onUpdate:()=>{if(ctx.mode==='list')renderList();},
  legendNote:'Rainfall data: PRISM Climate Group, Oregon State University.',welcomeTitle:'Data centers and Texas rainfall',
  about:`<p>This map shows how much rain falls where Texas\'s data centers are being built. "Average yearly rainfall" is the 1991–2020 average, the standard 30-year baseline. "Last 12 months vs. average" compares the most recent 12 months${RC?' ('+esc(RC.label)+')':''} with that baseline: orange means drier than usual, blue wetter.</p><p>Rainfall comes from the PRISM Climate Group at Oregon State University: the 800-metre 1991–2020 normals, resampled to cells of about 2.5 km, and the 4-kilometre monthly grids as published. A site\'s value is read at its dot; a county\'s value is the average over the county. Recent months are provisional and can shift slightly as more station data arrive.</p>`});
renderList();
(function(){const h=decodeURIComponent(location.hash||'').replace(/^#/,'');let m;
  if((m=/(?:^|&)site=([^&]+)/.exec(h))&&WM.byId[m[1]])showSite(WM.byId[m[1]]);
  else if((m=/(?:^|&)zone=(\d)/.exec(h)))showZone(+m[1]);
  else if((m=/(?:^|&)county=(\d+)/.exec(h))&&WM.cname[m[1]])showCounty(m[1]);})();
</script>
</body>
</html>
