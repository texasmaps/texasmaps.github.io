<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Texas Groundwater Wells & Data Centers</title>
<meta name="description" content="Density of TWDB-recorded groundwater wells across Texas, and water wells drilled since 2020, with data center sites from Texas Data Center Watch: which projects land in the most well-dependent country.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="tx_water_map.css?v=20260925-4">
</head>
<body>
<div class="app">
<header>
  <button id="menubtn" aria-label="Show the list">☰ List</button>
  <h1>Texas <span>Wells</span> &amp; Data Centers</h1>
  <a class="allmaps" href="index.html">All maps</a>
  <div class="stats" id="stats"></div>
</header>
<aside>
  <div class="intro">How much the country around each data center already depends on groundwater. Darker shading means more wells. Click a county for its wells, or a site for the wells around it.</div>
  <div class="side" id="side"></div>
</aside>
<main>
  <svg id="map" xmlns="http://www.w3.org/2000/svg"></svg>
  <div class="ctrl"><button id="zin" title="Zoom in">+</button><button id="zout" title="Zoom out">−</button><button id="zfit" title="Reset view">⌂</button></div>
  <div class="legend" id="legend"></div>
  <div class="tip" id="tip"></div>
</main>
</div>
<script src="tx_counties.js?v=20260925-4"></script>
<script src="tx_dc_sites.js?v=20260925-4"></script>
<script src="tx_aquifers.js?v=20260925-4"></script>
<script src="tx_water_grid.js?v=20260925-4"></script>
<script src="tx_county_water.js?v=20260925-4"></script>
<script src="tx_surface_water.js?v=20260925-4"></script>
<script src="tx_water_map.js?v=20260925-4"></script>
<script>
const {esc,fmtMW,num,COL,LBL}=WM, $=id=>document.getElementById(id);
const P=WM.projects, side=$('side'), CW=WM.cw, NW=WM.water&&WM.water.newwells;
const sumMW=list=>Math.round(list.reduce((t,s)=>t+(s.mw||0),0));
const byCounty={};P.forEach(s=>(byCounty[s.fips]=byCounty[s.fips]||[]).push(s));
const w10=P.map(s=>s.wells10).sort((a,b)=>a-b), median=w10[Math.floor(w10.length/2)];
const dense=P.filter(s=>s.wells10>=200);
const countyRank=Object.entries(CW.counties).sort((a,b)=>b[1].w-a[1].w).map(([f])=>f);
const topUse=u=>{const e=Object.entries(u||{}).filter(([k])=>k!=='Unknown'&&k!=='Unused').sort((a,b)=>b[1]-a[1])[0];return e?e[0]:null;};
const stat=(v,l)=>`<div class="stat"><b>${v}</b><small>${l}</small></div>`;
$('stats').innerHTML=(NW?stat(num(NW.total),'water wells drilled since 2020'):stat(num(CW.total),'recorded wells'))+stat(num(median),'wells near a typical project')+stat(dense.length,'projects with 200+ wells nearby');
let ctx={mode:'list'};
const countyRow=(f,i)=>{const c=CW.counties[f],n=(byCounty[f]||[]).length,tu=topUse(c.u);return `<div class="row" data-county="${f}" tabindex="0"><span class="v" style="text-align:left">${i+1}</span><div><div class="n">${esc(c.n)} County</div><div class="m">${n?n+' project'+(n===1?'':'s'):'no projects'}${tu?' · mostly '+tu.toLowerCase():''}</div></div><span class="v"><b>${num(c.w)}</b><br>wells</span></div>`;};
function renderList(){
  const densest=P.slice().sort((a,b)=>b.wells10-a.wells10).slice(0,12);
  const nwRank=NW?Object.keys(CW.counties).sort((a,b)=>CW.counties[b].nw-CW.counties[a].nw).slice(0,10):[];
  const nwRow=(f,i)=>{const c=CW.counties[f],n=(byCounty[f]||[]).length,tu=topUse(c.nwu);return `<div class="row" data-county="${f}" tabindex="0"><span class="v" style="text-align:left">${i+1}</span><div><div class="n">${esc(c.n)} County</div><div class="m">${n?n+' project'+(n===1?'':'s'):'no projects'}${tu?' · mostly '+tu.toLowerCase():''}</div></div><span class="v"><b>${num(c.nw)}</b><br>since 2020</span></div>`;};
  const newest=NW?P.slice().sort((a,b)=>b.newwells10-a.newwells10).slice(0,10):[];
  const facts=[];if(NW){const dom=NW.uses.Domestic||0,top=CW.counties[nwRank[0]],tu=topUse(top.nwu),best=newest[0];
    facts.push(`Texans have drilled <b>${num(NW.total)} new water wells</b> since 2020, ${Math.round(100*dom/NW.total)}% of them for homes.`,
      `<b>${esc(top.n)} County</b> leads with ${num(top.nw)} new wells${tu?', mostly '+tu.toLowerCase():''}.`,
      `A typical project has <b>${num(median)} recorded wells</b> within six miles. ${esc(best.name)} in ${esc(best.county)} County has ${num(best.newwells10)} new wells nearby.`);}
  facts.push(`<b>${dense.length} projects</b> sit in areas with 200 or more recorded wells nearby.`);
  side.innerHTML=WM.glance(facts)+WM.siteList()+`${NW?`<div class="blk"><h3>Most new wells near a project <small>drilled since 2020 · within ~6 mi</small></h3>${newest.map(s=>WM.siteRow(s,`<b>${num(s.newwells10)}</b><br>new wells`)).join('')}</div>
    <div class="blk"><h3>Counties drilling the most <small>since 2020 · top 10</small></h3>${nwRank.map(nwRow).join('')}</div>
    <div class="blk"><h3>New wells by use <small>${num(NW.total)} since 2020</small></h3>${WM.useBars(NW.uses,NW.total)}</div>`:''}
    <div class="blk"><h3>Most recorded wells near a project <small>within ~6 mi</small></h3>${densest.slice(0,10).map(s=>WM.siteRow(s,`<b>${num(s.wells10)}</b><br>wells`)).join('')}</div>
    <div class="blk"><h3>Counties with the most recorded wells <small>top 10</small></h3>${countyRank.slice(0,10).map(countyRow).join('')}</div>
    <div class="blk"><h3>Recorded wells by use <small>${num(CW.total)} statewide</small></h3>${WM.useBars(CW.use,CW.total)}</div>
    `+WM.note('Counts leave out small colocation sites and withdrawn projects. A well count is wells on record, not water pumped.');
  WM.renderRows();WM.collapseAfter(2);
}
function setHash(h){try{history.replaceState(null,'',location.pathname+location.search+(h?'#'+h:''));}catch(e){}}
function showCounty(f){
  ctx={mode:'county',fips:f};WM.setFilter(null);WM.select(null);WM.highlightCounty(f);WM.zoomCounty(f);
  const c=CW.counties[f]||{w:0,u:{}};const sites=(byCounty[f]||[]).slice().sort((a,b)=>b.wells10-a.wells10);
  const rank=countyRank.indexOf(f)+1;
  side.innerHTML=`<div class="detail"><button class="back" id="back">← Back to list</button><h2>${esc(WM.cname[f])} County</h2><div class="sub">${num(c.w)} TWDB-recorded wells${rank?' · #'+rank+' of 254 counties':''}${c.r?' · '+c.r+' in/yr average rainfall':''}</div>
    <dl class="kv">${NW?`<dt>Drilled since 2020</dt><dd>${num(c.nw||0)} water wells${c.nw?' · #'+(Object.keys(CW.counties).sort((a,b)=>CW.counties[b].nw-CW.counties[a].nw).indexOf(f)+1)+' of 254':''}</dd>`:''}<dt>Projects</dt><dd>${sites.length}${sites.length?' · '+fmtMW(sumMW(sites))+' announced':''}</dd></dl></div>
    ${NW?`<div class="blk"><h3>New wells by use <small>${esc(WM.cname[f])} County · since 2020</small></h3>${WM.useBars(c.nwu||{},c.nw||0)}</div>`:''}
    <div class="blk"><h3>Recorded wells by use <small>${esc(WM.cname[f])} County</small></h3>${WM.useBars(c.u,c.w)}</div>
    <div class="blk"><h3>Sites in ${esc(WM.cname[f])} County <small>most wells nearby first</small></h3>${sites.length?sites.map(s=>WM.siteRow(s,`<b>${num(s.wells10)}</b><br>wells ≤6 mi${NW?'<br>'+num(s.newwells10)+' new':''}`)).join(''):'<div class="empty">No data center projects listed here.</div>'}</div>`;
  $('back').onclick=back;setHash('county='+f);
}
function showSite(s){
  WM.select(s.id);WM.zoomSite(s);
  const c=CW.counties[s.fips]||{};
  side.innerHTML=`<div class="detail" style="padding-bottom:0"><button class="back" id="back">← Back</button></div>`+WM.siteHTML(s,`<div class="note" style="padding:0 0 4px">${num(s.wellsCell)} well${s.wellsCell===1?'':'s'} in the pin's own ~10 sq mi cell; ${num(c.w)} in ${esc(s.county)} County${topUse(c.u)?', mostly '+topUse(c.u).toLowerCase():''}.</div>`);
  $('back').onclick=()=>{WM.select(null);if(ctx.mode==='county')showCounty(ctx.fips);else back();};
  setHash('site='+encodeURIComponent(s.id));
}
function back(){ctx={mode:'list'};WM.highlightCounty(null);WM.setFilter(null);WM.select(null);WM.fit();renderList();setHash('');}
side.addEventListener('click',e=>{const r=e.target.closest('.row[data-site],.row[data-county]');if(!r)return;if(r.dataset.county)showCounty(r.dataset.county);else showSite(WM.byId[r.dataset.site]);WM.closeAside();});
side.addEventListener('keydown',e=>{if(e.key==='Enter'){const r=e.target.closest('.row');if(r)r.click();}});
WM.init({major:false,minor:false,base:'wells',pins:true,colo:false,controls:['pins','colo','aqlines','rivers','basins','base'],
  listMetric:s=>NW?({html:`<b>${num(s.newwells10)}</b><br>new wells ≤6 mi`,key:s.newwells10}):({html:`<b>${num(s.wells10)}</b><br>wells ≤6 mi`,key:s.wells10}),listSortLabel:'most new wells nearby',
  onSite:showSite,onCounty:showCounty,onAquifer:null,onBackground:()=>{if(ctx.mode!=='list')back();},
  legendNote:'Well records: Texas Water Development Board.',welcomeTitle:'Data centers and Texas groundwater wells',
  about:`<p>This map shows how much the land around each data center already relies on groundwater. "All recorded wells" are the ${num(CW.total)} wells in the Texas Water Development Board\'s Groundwater Database (this copy ${esc(CW.generated||'')}), not every well ever drilled. "Water wells drilled since 2020" counts the ${NW?num(NW.total):''} new and replacement water-supply wells in the reports every licensed driller must file${NW?', through '+esc(NW.through):''}; monitoring wells, soil borings and test, injection or geothermal holes are left out.</p><p>Shading counts wells per cell of about 10 square miles. Neither count says how much water is pumped, and "unused" includes plugged wells.</p>`});
renderList();
(function(){const h=decodeURIComponent(location.hash||'').replace(/^#/,'');let m;
  if((m=/(?:^|&)site=([^&]+)/.exec(h))&&WM.byId[m[1]])showSite(WM.byId[m[1]]);
  else if((m=/(?:^|&)county=(\d+)/.exec(h))&&WM.cname[m[1]])showCounty(m[1]);})();
</script>
</body>
</html>
